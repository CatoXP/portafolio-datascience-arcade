name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permisos minimos: leer el repo, escribir un despliegue de Pages y emitir el
# token OIDC que usa actions/deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Un solo despliegue a la vez. cancel-in-progress tiene que ser false:
# cancelar un despliegue a medias puede dejar el sitio en un estado roto.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck y build
        # El script build es "tsc --noEmit && vite build": un error de tipos
        # tumba el despliegue en vez de publicarlo roto.
        run: npm run build

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
