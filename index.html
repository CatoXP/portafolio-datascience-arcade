    <!-- Vista previa al compartir.

         og:image TIENE que ser absoluta: los rastreadores de LinkedIn,
         WhatsApp y Twitter no resuelven rutas relativas, asi que una ruta
         como /og.png les llega rota y la tarjeta sale sin imagen.

         La imagen es una captura real del sitio a 1200x630, la medida que
         esperan las tres plataformas. Al ser el diseño de verdad y no un
         mockup, lo que ve quien recibe el link es lo que va a encontrar. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="URIEL // CatoXP" />
    <meta property="og:locale" content="es_MX" />
    <meta property="og:url" content="https://catoxp.github.io/portfolio-for-fun/" />
    <meta property="og:title" content="URIEL // Científico de datos" />
    <meta
      property="og:description"
      content="Científico de datos para negocios: finanzas, inteligencia artificial y big data. Ciudad de México."
    />
    <meta property="og:image" content="https://catoxp.github.io/portfolio-for-fun/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Portafolio de Brandon Uriel García Sánchez: el nombre URIEL en letras recortadas sobre fondo negro y rojo."
    />
